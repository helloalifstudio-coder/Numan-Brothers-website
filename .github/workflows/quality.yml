name: Website quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: cms-ci
          POSTGRES_DB: nomaan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nomaan_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript checks
        run: bun run lint
      - name: Navigation and catalogue tests
        run: bun test tests/navigation.test.ts tests/cms-security.test.ts tests/cms-data.test.ts tests/metadata.test.ts tests/catalog-queries.test.ts tests/bulk-csv.test.ts tests/seo-routes.test.ts tests/catalog-load.test.ts tests/import-recovery.test.ts tests/premium-storefront.test.ts tests/architecture-cms.test.ts tests/cms-auth-flow.test.ts tests/site-content.test.ts tests/editorial-catalogue-reviews.test.ts tests/social-footer-hygiene.test.ts
      - name: Mobile/tablet layout regression contracts
        run: node --test tests/responsive-layout.test.mjs
      - name: Studio organization and media-scale regression contracts
        run: node --test tests/studio-media-scale.test.mjs
      - name: Contact dock and product-detail interaction tests
        run: bun test tests/commerce-ux.test.ts
      - name: Liquid hero and route-splitting contracts
        run: node --test tests/liquid-hero.test.mjs
      - name: SEO markup injection and sitemap manifest tests
        run: node --test tests/seo.test.mjs
      - name: Media approval permission and published-asset contract tests
        run: node --test tests/media-approval-contract.test.mjs
      - name: Release evidence gate negative tests
        run: |
          node --test tests/release-gate.test.mjs
          if node scripts/release-gate.mjs docs/RELEASE_EVIDENCE_TEMPLATE.json; then
            echo "::error::Unverified release template unexpectedly passed the go-live gate."
            exit 1
          fi
      - name: Client onboarding preflight contract tests
        run: node --test tests/client-preflight.test.mjs
      - name: Verify complete SQL Editor installer matches all fifteen source migrations
        run: node --test tests/sql-editor-bundle.test.mjs
      - name: PostgreSQL CMS role and publishing test
        env:
          PGPASSWORD: cms-ci
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: nomaan_ci
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/sql-editor/NOMAN_BROTHERS_INSTALL_FRESH_PROJECT.sql
          # Validate that an already-installed project can rerun the existing-table
          # SQL Editor reconciliation without duplicate-schema or policy failures.
          psql -v ON_ERROR_STOP=1 -f supabase/sql-editor/NOMAN_BROTHERS_COMPLETE_EXISTING_TABLES.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/assert_management.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/assert.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/assert_imports.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/assert_staging_integrity.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/assert_category_media.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/verify_supabase_inventory.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/assert_reviews.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/assert_media_lifecycle_scale.sql
      - name: Reject production deployments without client CMS credentials
        run: |
          if env VERCEL_ENV=production VITE_SUPABASE_URL= VITE_SUPABASE_PUBLISHABLE_KEY= VITE_SUPABASE_ANON_KEY= bun run build; then
            echo "::error::Production build accepted an unconfigured CMS backend."
            exit 1
          fi
      - name: Reject secret-key browser builds
        run: |
          if env VERCEL_ENV=production VITE_SUPABASE_URL=https://exampleproject123.supabase.co VITE_SUPABASE_PUBLISHABLE_KEY=sb_secret_not_a_real_key_12345678901234567890 bun run build; then
            echo "::error::Production bundle accepted a private Supabase API key."
            exit 1
          fi
      - name: Production build
        run: bun run build
      - name: Verify preserved shell for product SEO function
        run: node scripts/check-ssr-shell.mjs
      - name: Verify crawlable pre-rendered category output
        run: |
          node -e "const fs=require('fs');for(const path of ['dist/men/index.html','dist/men/sherwani/index.html','dist/kids/index.html']){const html=fs.readFileSync(path,'utf8');if(!/<h1>/.test(html))process.exit(1)}"
      - name: Verify unconfigured review build is not search-indexable
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('dist/index.html','utf8');const robots=fs.readFileSync('dist/robots.txt','utf8');if(!html.includes('name=\"robots\" content=\"noindex')||!robots.includes('Disallow: /'))process.exit(1)"

  browser-ui-smoke:
    needs: typecheck-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Playwright Chromium
        run: |
          npm install --prefix /tmp/nb-browser --no-save --no-package-lock playwright@1.58.2
          /tmp/nb-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Test storefront, Studio, garment pages and 18 responsive viewport sizes
        env:
          NODE_PATH: /tmp/nb-browser/node_modules
          VITE_SUPABASE_URL: https://fixture.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_testfixture12345678
          NB_MOCK_CMS: '1'
        run: |
          bun run dev --host 127.0.0.1 --port 4173 > /tmp/nb-vite-browser.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-browser-smoke.mjs
      - name: Test live customer website after main deploy
        if: github.ref == 'refs/heads/main'
        env:
          NODE_PATH: /tmp/nb-browser/node_modules
          NB_MODE: live
          NB_TEST_URL: https://numan-brothers-website.vercel.app
        run: node scripts/qa-browser-smoke.mjs
      - name: Test live Studio deployment after main deploy
        if: github.ref == 'refs/heads/main'
        env:
          NODE_PATH: /tmp/nb-browser/node_modules
          NB_MODE: live
          NB_TEST_URL: https://numan-brothers-cms-showroom.vercel.app
        run: node scripts/qa-browser-smoke.mjs
      - name: Retain mobile and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-browser-evidence
          path: artifacts/browser/
          retention-days: 14
          if-no-files-found: ignore

  cleanup-merged-working-branches:
    name: Remove safely merged temporary branches
    needs: [typecheck-and-build, browser-ui-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Verify merged PRs and delete unchanged working branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          base=f'https://api.github.com/repos/{repo}'
          headers={
              'Authorization':'Bearer '+token,
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'nomaan-safe-merged-branch-maintenance',
          }

          def api(path,method='GET'):
              req=urllib.request.Request(base+path,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=25) as response:
                  raw=response.read()
                  return json.loads(raw) if raw else None

          def pages(endpoint):
              result=[]
              for page in range(1,11):
                  chunk=api(f'{endpoint}&page={page}')
                  if not isinstance(chunk,list): raise RuntimeError('Unexpected GitHub API response')
                  result.extend(chunk)
                  if len(chunk)<100:break
              return result

          branches=pages('/branches?per_page=100')
          prs=pages('/pulls?state=closed&per_page=100')
          removed=[];skipped=[]
          for branch in branches:
              name=branch['name']
              if name=='main':continue
              # Intentionally refuse unrecognized, unmerged, modified or
              # protected branches. Never force-delete a remote ref.
              if not (name.startswith('agm/') or name=='sql-existing-tables-completion-20261109' or name=='vercel/install-vercel-web-analytics-c8r0zh') or branch.get('protected'):
                  skipped.append((name,'not an authorized unprotected working branch'))
                  continue
              eligible=[
                  pr for pr in prs
                  if pr.get('merged_at')
                  and pr.get('base',{}).get('ref')=='main'
                  and pr.get('head',{}).get('ref')==name
                  and (pr.get('head',{}).get('repo') or {}).get('full_name')==repo
                  and pr.get('head',{}).get('sha')==branch['commit']['sha']
              ]
              if not eligible:
                  skipped.append((name,'not proven identical to a merged PR head'))
                  continue
              encoded=urllib.parse.quote(name,safe='/')
              api('/git/refs/heads/'+encoded,'DELETE')
              removed.append(name)
              print('Deleted verified merged branch:',name)
          for name,reason in skipped:print('Kept',name,':',reason)
          remaining=[b['name'] for b in pages('/branches?per_page=100')]
          print('Remaining branches:',', '.join(remaining))
          print('Removed count:',len(removed),'Unverified retained:',len(skipped))
          if skipped:
              raise SystemExit('Some branches were retained because deletion safety could not be verified.')
          PY
